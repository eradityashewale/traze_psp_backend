# Alembic configuration. The database connection is NOT set here:
# alembic/env.py takes it from the app's .env (DB_NAME, DB_USER, DB_PASS, DB_HOST).

[alembic]
script_location = alembic
prepend_sys_path = .
# 0001_initial_schema.py, 0002_add_psp_account_number.py, ...
file_template = %%(rev)s_%%(slug)s
